          node scripts/validate-crm-01b1-guard-test.mjs
          node scripts/validate-crm-01b2-guard.mjs
          node scripts/validate-crm-01b2-guard-test.mjs
          node scripts/crm-01b3b3-disabled-options-test.mjs
          node scripts/validate-crm-01b3b2-guard.mjs
