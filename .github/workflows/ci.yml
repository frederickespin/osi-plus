name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_request_barrier_artifacts:
        description: Generate and publish one controlled WebKit failure artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma may fail during `prisma generate` if these are missing.
      # Use harmless dummy URLs for CI (no DB connection is performed).
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=osi
      DIRECT_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=osi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Prisma schema target
        run: node scripts/validate-prisma-schema-target.mjs

      - name: Validate Prisma datamodel
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  browser-session-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANONICAL_DB_VALIDATION: "true"
      DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DIRECT_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01D_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01E_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01F_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01G_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01H_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01I_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01J_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B1_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B2_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B3A_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B3B_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      CRM01A_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      CRM01B1_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      V17_CASE_CLIENT_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      V17_CASE_PUBLIC_REF_TEST_DATABASE_URL: postgresql://postgres:browser-ci-only@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01B_AUTH_MODE: LEGACY
      MT01B_TENANT_SWITCH_ENABLED: "false"
      VITE_MT01B2_CLIENT_ENABLED: "false"
      VITE_CRM_PIPELINE_CLIENT_MODE: "DISABLED"
      COMMERCIAL_TENANCY_WRITE_MODE: LEGACY_ONLY
      COMMERCIAL_TENANCY_READ_MODE: LEGACY_ONLY
      COMMERCIAL_TENANCY_MUTATION_MODE: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install isolated browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Report browser infrastructure before validation
        run: node scripts/report-browser-ci-diagnostics.mjs before

      - name: Build LEGACY and verify inactive bundle
        run: |
          npm run build
          node scripts/validate-canonical-ci.mjs --preflight
          node scripts/validate-canonical-activation-guard-test.mjs
          npm run guard:v17-auth-canonical-context
          npm run test:v17-auth-canonical-context
          npm run guard:v17-auth-users-tenant-first
          npm run test:v17-auth-users-tenant-first
          node scripts/validate-mt01c1a-guard.mjs
          node scripts/validate-mt01c1b1-guard.mjs
          node scripts/validate-mt01c1b2a-guard.mjs
          node scripts/validate-mt01c1b2b-guard.mjs
          node scripts/validate-mt01c1b3a-guard.mjs
          node scripts/validate-mt01c2b1-guard.mjs
          node scripts/validate-mt01c2b2-guard.mjs
          node scripts/validate-mt01c2b2-guard-test.mjs
          node scripts/validate-mt01c2b3a-guard.mjs
          node scripts/validate-mt01c2b3a-guard-test.mjs
          node scripts/validate-mt01c2b3b-guard.mjs
          node scripts/validate-mt01c2b3b-guard-test.mjs
          node scripts/mt-01c2b3b-local-target-test.mjs
          node scripts/mt-01c2b3c-test.mjs
          node scripts/validate-mt01c2b3c-guard.mjs
          node scripts/validate-mt01c2b3c-guard-test.mjs
          node scripts/validate-crm-01a-guard.mjs
          node scripts/validate-crm-01a-guard-test.mjs
          node scripts/crm-01a-local-target-test.mjs
          node scripts/validate-crm-01b1-guard.mjs
          node scripts/validate-crm-01b1-guard-test.mjs
          node scripts/crm-01b1-local-target-test.mjs
          node scripts/validate-crm-01b2-guard.mjs
          node scripts/validate-crm-01b2-guard-test.mjs
          node scripts/crm-01b2-local-target-test.mjs
          node scripts/crm-01b3a-http-test.mjs
          node scripts/validate-crm-01b3a-guard.mjs
          node scripts/validate-crm-01b3a-guard-test.mjs
          node scripts/validate-crm-cors-guard.mjs
          node scripts/validate-crm-cors-guard-test.mjs
          npm run test:protected-cors-http
          node scripts/v17-crm-vary-contract-test.mjs
          node scripts/validate-v17-crm-vary-guard.mjs
          node scripts/validate-v17-crm-vary-guard-test.mjs
          npm run guard:auth-legacy-private-headers
          node scripts/crm-01b3b1-gate-test.mjs
          node scripts/crm-01b3b3-disabled-options-test.mjs
          node scripts/validate-crm-01b3b1-guard.mjs
          node scripts/validate-crm-01b3b1-guard-test.mjs
          node scripts/validate-crm-01b3b2-guard.mjs
          node scripts/validate-crm-01b3b2-guard-test.mjs
          node scripts/crm-01b3b3-test.mjs
          node scripts/validate-crm-01b3b3-guard.mjs
          node scripts/validate-crm-01b3b3-guard-test.mjs
          node scripts/mt-01b1-refresh-race-evidence-test.mjs
          node scripts/validate-sec-dep-01-guard.mjs
          node scripts/validate-sec-dep-01-guard-test.mjs
          node scripts/validate-v17-hub-guard.mjs
          npm run guard:v17-hub-auth-lazy
          npm run guard:v17-admin-tenant-memberships
          npm run test:v17-admin-tenant-memberships:http
          npm run guard:v17-admin-identity
          npm run test:v17-admin-identity:http
          npm run test:v17-production-pilot-gates
          npm run guard:v17-crm-icp-foundation
          npm run test:v17-crm-icp-foundation
          npm run guard:v17-crm-icp-api
          npm run test:v17-crm-icp-api
          npm run guard:v17-crm-icp-ui
          npm run guard:v17-icp-consolidation
          node scripts/validate-v17-commercial-crm-guard.mjs
          npm run guard:v17-commercial-inbox-reload-race
          npm run guard:v17-commercial-crm-preview
          npm run test:v17-commercial-crm-preview:guard
          npm run test:v17-commercial-crm-preview
          npm run test:v17-commercial-crm-preview:http
          npm run test:v17-erp-crm-foundation-02c
          npm run guard:v17-erp-crm-foundation-02c
          npm run test:commercial-tenancy-mutation-gate
          npm run guard:commercial-tenancy-mutation-gate
          npm run test:v17-app-environment
          npm run test:webkit-internal-recovery

      - name: Typecheck inactive relational CRM client
        run: |
          npm run typecheck:crm-01b3b2
          npm run typecheck:v17-commercial-crm

      - name: Validate cross-tab sessions in real browsers
        run: npm run test:mt01b2b:browser

      - name: Upload sanitized logout-refresh timeline
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mt01b2b-logout-refresh-timeline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mt01b2b-logout-refresh-timeline
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate anonymous sessions in real browsers
        env:
          AUTH_NULL_ARTIFACT_DIR: ${{ runner.temp }}/auth-null-playwright-artifacts
        run: npm run test:auth-null:browser

      - name: Validate safe PIC rendering in real browsers
        run: npm run test:sec-dep-01:browser

      - name: Validate inactive relational CRM client in real browsers
        id: crm_relational_browser
        env:
          CRM01B3B2_ARTIFACT_DIR: ${{ runner.temp }}/crm01b3b2-playwright-artifacts
        run: npm run test:crm-01b3b2:browser

      - name: Generate controlled request-barrier failure evidence
        if: github.event_name == 'workflow_dispatch' && inputs.verify_request_barrier_artifacts
        shell: bash
        env:
          CRM01B3B2_ARTIFACT_DIR: ${{ runner.temp }}/request-barrier-artificial-raw
          V17_REQUEST_BARRIER_ARTIFACT_PROBE: "1"
        run: |
          set -uo pipefail
          set +e
          npx playwright test -c playwright.crm-01b3b2.config.ts relational-pipeline.spec.ts \
            --project=webkit-mobile \
            --grep "respuesta perdida conserva la intención" \
            --workers=1 2>&1 | tee "${{ runner.temp }}/request-barrier-artificial.log"
          playwright_status=${PIPESTATUS[0]}
          set -e
          test "$playwright_status" -eq 1
          grep -Fq "V17_REQUEST_BARRIER_ARTIFACT_PROBE" "${{ runner.temp }}/request-barrier-artificial.log"
          python tests/crm-01b3b2/sanitize_failure_artifacts.py \
            "${{ runner.temp }}/request-barrier-artificial-raw" \
            "${{ runner.temp }}/request-barrier-artificial-sanitized"

      - name: Publish controlled request-barrier failure evidence
        if: github.event_name == 'workflow_dispatch' && inputs.verify_request_barrier_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: request-barrier-artificial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/request-barrier-artificial-sanitized
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Validate inactive OSi Plus Hub in real browsers
        run: npm run test:v17-hub:browser

      - name: Validate inactive V17 Commercial Inbox in real browsers
        env:
          COMMERCIAL_CRM_ARTIFACT_DIR: ${{ runner.temp }}/v17-commercial-crm-playwright-artifacts
        run: npm run test:v17-commercial-crm:browser

      - name: Validate consolidated ICP v2 UI in real browsers (24/24)
        run: npm run test:v17-crm-icp-ui:browser

      - name: Validate isolated ICP visual Preview (1/1)
        run: npm run test:v17-crm-icp-ui:visual

      - name: Validate isolated CRM Preview rehearsal in real browsers (24/24)
        run: npm run test:v17-commercial-crm-preview:browser

      - name: Validate inactive Production Read pilot in real browsers (18/18)
        run: npm run test:v17-erp-crm-foundation-02c:browser

      - name: Report browser infrastructure after validation
        if: always()
        run: node scripts/report-browser-ci-diagnostics.mjs after

      - name: Upload AUTH-NULL failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-null-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auth-null-playwright-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Upload relational CRM failure diagnostics
        if: steps.crm_relational_browser.outcome == 'failure'
        shell: bash
        run: |
          python tests/crm-01b3b2/sanitize_failure_artifacts.py \
            "${{ runner.temp }}/crm01b3b2-playwright-artifacts" \
            "${{ runner.temp }}/crm01b3b2-playwright-artifacts-sanitized"

      - name: Publish sanitized relational CRM failure diagnostics
        if: steps.crm_relational_browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: crm01b3b2-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crm01b3b2-playwright-artifacts-sanitized
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload Commercial Inbox failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v17-commercial-crm-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v17-commercial-crm-playwright-artifacts
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Verify repository cleanliness
        run: git diff --exit-code

  canonical-database-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANONICAL_DB_VALIDATION: "true"
      VERCEL_ENV: development
      DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DIRECT_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01D_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01E_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01F_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01G_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01H_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01I_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      DB01J_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C1B2B_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B1_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B2_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B3A_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01C2B3B_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      CRM01A_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      CRM01B1_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      V17_CASE_CLIENT_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      V17_CASE_PUBLIC_REF_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      CRM01B2_TEST_DATABASE_URL: postgresql://postgres:osi-ci-only-password@127.0.0.1:55432/osi_db01n_ci?schema=osi
      MT01B_AUTH_MODE: LEGACY
      MT01B_TENANT_SWITCH_ENABLED: "false"
      VITE_MT01B2_CLIENT_ENABLED: "false"
      VITE_CRM_PIPELINE_CLIENT_MODE: "DISABLED"
      COMMERCIAL_TENANCY_WRITE_MODE: LEGACY_ONLY
      COMMERCIAL_TENANCY_READ_MODE: LEGACY_ONLY
      COMMERCIAL_TENANCY_MUTATION_MODE: DISABLED
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Start PostgreSQL 18 on host loopback
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name osi-postgres-18 --network host \
            -e POSTGRES_DB=osi_db01n_ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=osi-ci-only-password \
            postgres:18 \
            -c listen_addresses=127.0.0.1 \
            -c port=55432
          for attempt in {1..30}; do
            if docker exec osi-postgres-18 pg_isready -h 127.0.0.1 -p 55432 -U postgres -d osi_db01n_ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 40 osi-postgres-18
          exit 1

      - name: Install
        run: npm ci

      - name: Validate local target and active chain
        run: |
          node scripts/validate-canonical-ci.mjs --preflight
          node scripts/validate-canonical-activation-guard-test.mjs
          node scripts/validate-mt01b3a-auth-guard.mjs
          node scripts/validate-mt01b3a-auth-guard-test.mjs
          npm run guard:v17-auth-canonical-context
          npm run test:v17-auth-canonical-context
          npm run guard:v17-auth-users-tenant-first
          npm run test:v17-auth-users-tenant-first
          node scripts/validate-mt01c1a-canonical-guard-test.mjs
          node scripts/validate-mt01c1a-guard.mjs
          node scripts/validate-mt01c1b1-canonical-guard-test.mjs
          node scripts/validate-mt01c1b1-guard.mjs
          node scripts/validate-mt01c1b2a-guard.mjs
          npm run guard:auth-legacy-private-headers
          node scripts/validate-sec-com-01a-guard.mjs
          node scripts/validate-sec-com-01a-guard-test.mjs
          node scripts/validate-mt01c2b1-guard.mjs
          node scripts/validate-mt01c2b1-guard-test.mjs
          node scripts/validate-v17-case-client-guard.mjs
          node scripts/validate-v17-case-client-guard-test.mjs
          node scripts/validate-v17-case-public-ref-guard.mjs
          node scripts/validate-v17-case-public-ref-guard-test.mjs
          node scripts/validate-v17-crm-case-mutations-guard.mjs
          node scripts/validate-v17-crm-case-mutations-guard-test.mjs
          npm run guard:v17-crm-icp-foundation
          npm run test:v17-crm-icp-foundation
          npm run guard:v17-crm-icp-api
          npm run test:v17-crm-icp-api
          npm run guard:v17-crm-icp-ui
          npm run guard:v17-icp-consolidation
          node scripts/validate-v17-hub-guard.mjs
          node scripts/validate-v17-hub-auth-lazy-boundary-guard.mjs
          npm run guard:v17-admin-tenant-memberships
          npm run test:v17-admin-tenant-memberships:http
          npm run test:v17-production-pilot-gates
          node scripts/v17-case-client-local-target-test.mjs
          node scripts/validate-mt01c2b2-guard.mjs
          node scripts/mt-01c2b2-database-guard-test.mjs
          node scripts/validate-mt01c2b2-guard-test.mjs
          node scripts/validate-mt01c2b3a-guard.mjs
          node scripts/validate-mt01c2b3a-guard-test.mjs
          node scripts/validate-mt01c2b3b-guard.mjs
          node scripts/validate-mt01c2b3b-guard-test.mjs
          node scripts/mt-01c2b3c-test.mjs
          node scripts/validate-mt01c2b3c-guard.mjs
          node scripts/validate-mt01c2b3c-guard-test.mjs
          npm run test:commercial-tenancy-mutation-gate
          npm run guard:commercial-tenancy-mutation-gate
          node scripts/validate-crm-01a-guard.mjs
          node scripts/validate-crm-01a-guard-test.mjs
          node scripts/crm-01a-local-target-test.mjs
          node scripts/validate-crm-01b1-guard.mjs
          node scripts/validate-crm-01b1-guard-test.mjs
          node scripts/crm-01b1-local-target-test.mjs
          node scripts/validate-crm-01b2-guard.mjs
          node scripts/validate-crm-01b2-guard-test.mjs
          node scripts/crm-01b2-local-target-test.mjs
          node scripts/crm-01b3a-http-test.mjs
          node scripts/validate-crm-01b3a-guard.mjs
          node scripts/validate-crm-01b3a-guard-test.mjs
          node scripts/validate-crm-cors-guard.mjs
          node scripts/validate-crm-cors-guard-test.mjs
          npm run test:protected-cors-http
          node scripts/v17-crm-vary-contract-test.mjs
          node scripts/validate-v17-crm-vary-guard.mjs
          node scripts/validate-v17-crm-vary-guard-test.mjs
          node scripts/crm-01b3b1-gate-test.mjs
          node scripts/crm-01b3b3-disabled-options-test.mjs
          node scripts/validate-crm-01b3b1-guard.mjs
          node scripts/validate-crm-01b3b1-guard-test.mjs
          node scripts/validate-crm-01b3b2-guard.mjs
          node scripts/validate-crm-01b3b2-guard-test.mjs
          node scripts/crm-01b3b3-test.mjs
          node scripts/validate-crm-01b3b3-guard.mjs
          node scripts/validate-crm-01b3b3-guard-test.mjs

      - name: Validate and generate Prisma
        run: |
          node scripts/validate-prisma-schema-target.mjs
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma

      - name: Deploy canonical migrations from empty database
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Verify idempotent second deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx prisma migrate deploy --schema prisma/schema.prisma 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "No pending migrations to apply." <<< "$output"

      - name: Verify migration status and drift
        shell: bash
        run: |
          set -euo pipefail
          npx prisma migrate status --schema prisma/schema.prisma
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > "$RUNNER_TEMP/canonical-drift.sql"
          diff_status=$?
          set -e
          cat "$RUNNER_TEMP/canonical-drift.sql"
          test "$diff_status" -eq 0
          grep -Fxq -- "-- This is an empty migration." "$RUNNER_TEMP/canonical-drift.sql"

      - name: Verify explicit SQL-only catalog baseline
        run: node scripts/crm-01b1-sql-drift-baseline.mjs

      - name: Validate V17 ICP v2 database foundation
        env:
          V17_CRM_ICP_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:v17-crm-icp-foundation:db

      - name: Validate V17 ICP v2 isolated API against PostgreSQL
        env:
          V17_CRM_ICP_API_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:v17-crm-icp-api:db

      - name: Verify canonical history and safe modes
        run: node scripts/validate-canonical-ci.mjs

      - name: Run canonical domain suites and SEC-COM-01A route security
        id: canonical_domain_suites
        env:
          MT01B_REFRESH_RACE_ARTIFACT_PATH: ${{ runner.temp }}/mt01b-refresh-race-evidence/failure.json
        run: |
          node scripts/run-canonical-db-tests.mjs
          node scripts/mt-01b2a-test.ts
          node scripts/mt-01b3a-test.mjs
          node scripts/mt-01b3b1-test.mjs
          node scripts/mt-01c1b2a-test.mjs
          node scripts/auth-json-02-test.mjs
          npm run test:auth-legacy-private-headers
          node scripts/validate-mt01c1b2b-guard.mjs
          npm run test:v17-admin-tenant-memberships
          npm run test:v17-admin-membership-bootstrap
          npm run test:v17-admin-membership-public-ref:migration
          npm run test:v17-admin-identity
          npm run test:v17-admin-initial-permissions-bootstrap
          npm run test:v17-production-pilot-gates

      - name: Publish sanitized MT-01B1 refresh-race evidence
        if: steps.canonical_domain_suites.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mt01b-refresh-race-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mt01b-refresh-race-evidence/failure.json
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Build
        run: npm run build

      - name: Recheck security and repository cleanliness
        run: |
          node scripts/validate-canonical-ci.mjs --preflight
          node scripts/validate-mt01c1b1-guard.mjs
          node scripts/validate-mt01c1b2a-guard.mjs
