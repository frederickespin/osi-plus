name: Administration Hub

on:
  pull_request:
    paths:
      - "src/administration/**"
      - "src/admin-tenant/**"
      - "src/crm-services/ServiceConfigurationAdmin.tsx"
      - "src/hub/**"
      - "tests/v17-administration/**"
      - "scripts/v17-administration-access-test.mjs"
      - "playwright.v17-administration.config.ts"
      - ".github/workflows/v17-administration.yml"

permissions:
  contents: read

jobs:
  administration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check administration types, access and authorization
        run: |
          npm run typecheck:v17-commercial-crm
          npm run test:v17-administration
          npm run guard:v17-admin-tenant-memberships
          npm run guard:v17-hub-auth-lazy
          npx eslint src/administration src/admin-tenant/AdminTenantMembershipModule.tsx src/crm-services/ServiceConfigurationAdmin.tsx tests/v17-administration playwright.v17-administration.config.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify administration navigation and permissions
        run: npm run test:v17-administration:browser
