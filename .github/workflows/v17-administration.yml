name: Administration Hub

on:
  pull_request:
    paths:
      - "src/administration/**"
      - "src/admin-tenant/**"
      - "shared/adminMembership*"
      - "shared/adminUserIdentity*"
      - "api/admin/memberships/**"
      - "api/admin/user-identities/**"
      - "api/admin/user-enrollments/**"
      - "api/_lib/adminMembership*"
      - "api/_lib/adminUserIdentity*"
      - "api/_lib/adminUserEnrollment*"
      - "api/_lib/rbac.js"
      - "src/crm-services/ServiceConfigurationAdmin.tsx"
      - "src/logistics-engine/LogisticsRulesAdmin.tsx"
      - "src/costing/CostingRulesAdmin.tsx"
      - "src/communications/CommunicationTemplatesAdmin.tsx"
      - "src/personnel-policies/PersonnelPoliciesAdmin.tsx"
      - "src/hub/**"
      - "tests/v17-administration/**"
      - "tests/v17-user-identity/**"
      - "scripts/v17-administration-access-test.mjs"
      - "scripts/v17-admin-membership-*-test.mjs"
      - "scripts/v17-admin-tenant-memberships*-test.mjs"
      - "scripts/v17-admin-user-identity*-test.mjs"
      - "scripts/fixtures/v17-user-identity-photo.mjs"
      - "scripts/validate-v17-admin-tenant-memberships-guard*.mjs"
      - "playwright.v17-administration.config.ts"
      - "playwright.v17-user-identity.config.ts"
      - "tsconfig.v17-user-identity.json"
      - ".github/workflows/v17-administration.yml"

permissions:
  contents: read

jobs:
  administration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check administration types, access and authorization
        run: |
          npm run typecheck:v17-commercial-crm
          npm run typecheck:v17-admin-user-identity
          npm run test:v17-administration
          npm run test:v17-admin-tenant-memberships:http
          npm run test:v17-admin-user-identity
          npm run test:v17-admin-user-identity:http
          npm run guard:v17-admin-tenant-memberships
          npm run guard:v17-hub-auth-lazy
          npx eslint src/administration src/admin-tenant src/crm-services/ServiceConfigurationAdmin.tsx tests/v17-administration tests/v17-user-identity playwright.v17-administration.config.ts playwright.v17-user-identity.config.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify administration navigation and permissions
        run: npm run test:v17-administration:browser
      - name: Verify company identity, private photos and enrollment
        run: npm run test:v17-admin-user-identity:browser
      - name: Upload synthetic administration screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: administration-synthetic-screenshots
          path: |
            /tmp/osi-administration-18a-*.png
            /tmp/osi-users-roles-19b-*.png
            /tmp/osi-user-identity-19c-*.png
          if-no-files-found: ignore
          retention-days: 7
