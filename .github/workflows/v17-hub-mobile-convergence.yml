name: Hub and Mobile integration

on:
  pull_request:
    paths:
      - "src/hub/**"
      - "src/commercial-crm/AdvancedErpShell.tsx"
      - "src/survey/SurveyApp.tsx"
      - "tests/v17-consolidated-preview/**"
      - "scripts/validate-v17-hub-auth-lazy-boundary-guard*.mjs"
      - ".github/workflows/v17-hub-mobile-convergence.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check integration types and authorization
        run: |
          npm run typecheck:v17-commercial-crm
          npm run guard:v17-consolidated-preview
          npm run guard:v17-hub-auth-lazy
          npx eslint src/hub src/commercial-crm/AdvancedErpShell.tsx src/survey/SurveyApp.tsx tests/v17-consolidated-preview/mobile-integration.spec.ts
      - name: Build
        run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify commercial flow, Mobile, and permissions
        run: npx playwright test -c playwright.v17-consolidated-preview.config.ts --workers=2
