name: Almacenes

on:
  pull_request:
    paths:
      - "src/warehouses/**"
      - "src/materials-inventory/**"
      - "src/tools-equipment/**"
      - "src/hub/**"
      - "src/components/ui/compact-form.ts"
      - "src/components/ui/numeric-input.tsx"
      - "api/materials/**"
      - "api/_lib/materialsInventory*"
      - "api/_lib/warehouse*"
      - "api/_lib/toolsEquipment*"
      - "api/_lib/logisticsEngineDomain.js"
      - "shared/warehouseConfigurationMigration.js"
      - "shared/warehouseSheet*"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/v17-warehouse*"
      - "scripts/validate-v17-materials-inventory*"
      - "scripts/protected-cors-route-inventory.json"
      - "scripts/validate-mt01b3a-auth-guard*"
      - "tests/v17-warehouses/**"
      - "tests/v17-warehouse-configuration/**"
      - "tests/v17-warehouse-sheet/**"
      - "playwright.v17-warehouse-sheet.config.ts"
      - "playwright.v17-warehouse-configuration.config.ts"
      - "tests/v17-materials-inventory/**"
      - "tests/v17-tools-equipment/**"
      - "playwright.v17-warehouses.config.ts"
      - "playwright.v17-materials-inventory.config.ts"
      - "playwright.v17-tools-equipment.config.ts"
      - ".github/workflows/v17-warehouses.yml"

permissions:
  contents: read

jobs:
  warehouses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify warehouse types, authorization and API contracts
        run: |
          npm run typecheck:v17-commercial-crm
          npm run test:v17-warehouses
          npm run test:v17-warehouse-configuration
          npm run test:v17-warehouse-sheet
          npm run test:v17-materials-inventory
          npm run guard:v17-materials-inventory
          npm run guard:v17-tools-equipment
          npm run guard:v17-hub-auth-lazy
          node scripts/validate-mt01b3a-auth-guard.mjs
          node scripts/validate-mt01b3a-auth-guard-test.mjs
          npx eslint src/warehouses src/materials-inventory src/tools-equipment tests/v17-warehouses tests/v17-materials-inventory/warehouse-consumer.spec.ts tests/v17-tools-equipment/warehouse-consumer.spec.ts playwright.v17-warehouses.config.ts playwright.v17-warehouse-configuration.config.ts tests/v17-warehouse-configuration api/_lib/warehouse*.js shared/warehouseConfigurationMigration.js shared/warehouseSheetAddress.js shared/warehouseSheetAddress.d.ts shared/warehouseSheetMigration.js playwright.v17-warehouse-sheet.config.ts tests/v17-warehouse-sheet scripts/v17-warehouse-sheet-client-test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify spaces, automatic identifiers, retries and section isolation
        run: npm run test:v17-warehouses:browser
      - name: Verify area uses, inherited controls and cross-section recovery
        run: npm run test:v17-warehouse-configuration:browser
      - name: Verify inline worksheet, automatic labels and exact retry recovery
        run: npm run test:v17-warehouse-sheet:browser
      - name: Verify existing inventory consumers and restricted readers
        run: npm run test:v17-materials-inventory:browser -- --project=chromium-desktop --project=chromium-mobile
      - name: Verify existing equipment consumers and restricted readers
        run: npm run test:v17-tools-equipment:browser -- --project=chromium-desktop --project=chromium-mobile
      - name: Upload synthetic warehouse screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warehouses-synthetic-screenshots
          path: |
            /tmp/osi-warehouses-20a-*.png
            /tmp/osi-warehouse-20b-*.png
            /tmp/osi-warehouse-20c-*.png
          if-no-files-found: ignore
          retention-days: 7
