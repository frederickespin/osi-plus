name: Warehouse Preview PostgreSQL 17

on:
  pull_request:
    paths:
      - ".github/workflows/warehouse-preview-pg17.yml"
      - "scripts/v17-warehouse-configuration*.mjs"
      - "scripts/v17-warehouse-sheet*.mjs"
      - "scripts/v17-warehouse-policy*.mjs"
      - "scripts/v17-warehouse-location*.mjs"
      - "scripts/capture-v17-warehouse-configuration*.mjs"
      - "scripts/capture-v17-warehouse-sheet*.mjs"
      - "scripts/canonical-migrations.mjs"
      - "scripts/crm-01b1-sql-drift-baseline.mjs"
      - "tests/crm-01b1/warehouse-configuration-20b*.json"
      - "tests/crm-01b1/warehouse-sheet-20c*.json"
      - "prisma/**"
      - "api/_lib/warehouse*"
      - "api/_lib/materialsInventoryDomain.js"
      - "api/_lib/toolsEquipmentDomain.js"
      - "api/_lib/logisticsEngineDomain.js"
      - "shared/warehouseConfigurationMigration.js"
      - "shared/warehouseSheetMigration.js"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: warehouse-preview-pg17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  warehouse-pg17-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V17_WAREHOUSE_CONFIGURATION_LOCAL_COMPAT: PG17
      V17_WAREHOUSE_CONFIGURATION_PG17_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55434/osi_warehouse_17_compat?schema=osi
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55434/osi_warehouse_17_compat?schema=osi
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55434/osi_warehouse_17_compat?schema=osi
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Start PostgreSQL 17.11 on host loopback
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name osi-warehouse-postgres-17 --network host \
            -e POSTGRES_DB=osi_warehouse_17_compat \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C.UTF-8' \
            -e TZ=UTC \
            postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f \
            -c listen_addresses=127.0.0.1 \
            -c port=55434 \
            -c timezone=UTC \
            -c log_timezone=UTC
          for attempt in {1..30}; do
            if docker exec osi-warehouse-postgres-17 pg_isready -h 127.0.0.1 -p 55434 -U postgres -d osi_warehouse_17_compat >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 40 osi-warehouse-postgres-17
          exit 1
      - name: Install locked dependencies and verify guards
        run: |
          npm ci
          node scripts/validate-prisma-schema-target.mjs
          node scripts/v17-warehouse-configuration-pg17-local-target-test.mjs
          node scripts/v17-warehouse-configuration-preview-migrate-test.mjs
          node scripts/v17-warehouse-sheet-preview-migrate-test.mjs
      - name: Verify empty isolated target before migrations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PrismaClient } from '@prisma/client';
          const expected = 'postgresql://postgres:postgres@127.0.0.1:55434/osi_warehouse_17_compat?schema=osi';
          assert.equal(process.env.V17_WAREHOUSE_CONFIGURATION_PG17_DATABASE_URL, expected);
          assert.equal(process.env.DATABASE_URL, expected);
          assert.equal(process.env.DIRECT_URL, expected);
          const prisma = new PrismaClient({ datasources: { db: { url: expected } }, log: [] });
          try {
            const [identity] = await prisma.$queryRawUnsafe("SELECT current_database() AS database, current_setting('neon.branch_id', true) AS branch, current_setting('server_version_num')::integer AS version, inet_server_addr()::text AS address, inet_server_port() AS port, to_regclass('osi._prisma_migrations') IS NULL AS ledger_absent");
            assert.equal(identity.database, 'osi_warehouse_17_compat');
            assert.equal(identity.branch, null);
            assert.equal(identity.version, 170011);
            assert.equal(identity.address?.split('/')[0], '127.0.0.1');
            assert.equal(identity.port, 55434);
            assert.equal(identity.ledger_absent, true);
          } finally { await prisma.$disconnect(); }
          NODE
      - name: Prepare exact37 and38 historical staging directories
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdirSync, copyFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateMigrationFiles } from './scripts/canonical-migrations.mjs';
          const source = validateMigrationFiles();
          assert.equal(source.length, 39);
          assert.equal(source.at(-1), '20261101020000_v17_warehouse_sheet');
          assert.equal(source[37], '20261101010000_v17_warehouse_configuration');
          assert.equal(source[36], '20261031010000_v17_fleet_driver_authority');
          for (const count of [37, 38]) {
            const stage = join(process.env.RUNNER_TEMP, `warehouse-pg17-${count}`);
            mkdirSync(join(stage, 'migrations'), { recursive: true });
            copyFileSync('prisma/schema.prisma', join(stage, 'schema.prisma'));
            writeFileSync(join(stage, 'migrations/migration_lock.toml'), 'provider = "postgresql"\n');
            for (const name of source.slice(0, count)) {
              mkdirSync(join(stage, 'migrations', name));
              copyFileSync(join('prisma/migrations', name, 'migration.sql'), join(stage, 'migrations', name, 'migration.sql'));
            }
          }
          NODE
      - name: Apply37 and capture PostgreSQL17 baseline
        run: |
          npx prisma migrate deploy --schema "$RUNNER_TEMP/warehouse-pg17-37/schema.prisma"
          node scripts/capture-v17-warehouse-configuration-pg17-catalog.mjs --before "$RUNNER_TEMP/warehouse-pg17-before.json"
      - name: Upgrade37 to38 and verify preserved catalog and measured delta
        run: |
          npx prisma migrate deploy --schema "$RUNNER_TEMP/warehouse-pg17-38/schema.prisma"
          node scripts/capture-v17-warehouse-configuration-pg17-catalog.mjs --after "$RUNNER_TEMP/warehouse-pg17-after.json" --previous "$RUNNER_TEMP/warehouse-pg17-before.json"
      - name: Verify historical38 idempotent deploy and replayed catalog
        run: |
          npx prisma migrate deploy --schema "$RUNNER_TEMP/warehouse-pg17-38/schema.prisma"
          node scripts/capture-v17-warehouse-configuration-pg17-catalog.mjs --after "$RUNNER_TEMP/warehouse-pg17-replay.json" --previous "$RUNNER_TEMP/warehouse-pg17-before.json"
      - name: Verify area assignments and controls on PostgreSQL17
        run: npm run test:v17-warehouse-configuration:db
      - name: Capture PostgreSQL17 baseline before worksheet migration
        run: node scripts/capture-v17-warehouse-sheet-pg17-catalog.mjs --before "$RUNNER_TEMP/warehouse-pg17-sheet-before.json"
      - name: Upgrade38 to39 and verify preserved catalog and measured delta
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma
          node scripts/capture-v17-warehouse-sheet-pg17-catalog.mjs --after "$RUNNER_TEMP/warehouse-pg17-sheet-after.json" --previous "$RUNNER_TEMP/warehouse-pg17-sheet-before.json"
      - name: Verify worksheet migration idempotent deploy and replayed catalog
        run: |
          npx prisma migrate deploy --schema prisma/schema.prisma
          node scripts/capture-v17-warehouse-sheet-pg17-catalog.mjs --after "$RUNNER_TEMP/warehouse-pg17-sheet-replay.json" --previous "$RUNNER_TEMP/warehouse-pg17-sheet-before.json"
      - name: Verify atomic warehouse worksheets on PostgreSQL17
        run: npm run test:v17-warehouse-sheet:db
      - name: Upload synthetic compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warehouse-pg17-compatibility-evidence
          path: ${{ runner.temp }}/warehouse-pg17-*.json
          if-no-files-found: error
          retention-days: 7
