        case QRMaskPattern.PATTERN010 : return j % 3 === 0;

        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;

            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;

                throw new Error("mode:" + mode);
            }

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

            throw new Error("type:" + type);
        }

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

            ">" +  
            totalDataCount * 8 + 
            ")");

		}

  function article(v={},existing=null){const n=(k,label)=>number(v[k],label);const a={id:existing?.id||v.id||uid(),code:text(v.code,32).toUpperCase(),name:text(v.name,200),description:text(v.description,3000),category:text(v.category||'General',60),location:text(v.location,160),qty:Number(v.qty??1),kind:v.kind==='plano'?'plano':'3d',w:n('w','Ancho'),h:n('h','Alto'),d:n('d','Fondo'),weight:n('weight','Peso'),weightBasis:['measured','estimated'].includes(v.weightBasis)?v.weightBasis:'pending',turn:v.turn===true,lay:v.lay===true,brand:text(v.brand,100),model:text(v.model,100),serial:text(v.serial,120),author:text(v.author,120),technique:text(v.technique,120),notes:text(v.notes,3000),photos:Array.isArray(v.photos)?v.photos.map(p=>({id:p.id,caption:text(p.caption,200)})):[],createdAt:existing?.createdAt||v.createdAt||now(),updatedAt:now()};

  function validateProject(p){if(!validID(p.id)||!p.name||!Array.isArray(p.items)||p.items.length>MAX_ITEMS)throw Error('Proyecto no válido o demasiado grande.');const ids=new Set(),codes=new Set(),photoIds=new Set();let units=0;for(const a of p.items){if(!validID(a.id)||ids.has(a.id))throw Error('ID de artículo repetido.');ids.add(a.id);if(codes.has(a.code.toUpperCase()))throw Error('Código repetido: '+a.code);codes.add(a.code.toUpperCase());units+=a.qty;for(const f of a.photos)photoIds.add(f.id);}if(units>5000)throw Error('Máximo 5,000 unidades por proyecto.');if(photoIds.size>MAX_PHOTOS)throw Error('Máximo 200 fotografías por proyecto.');return p;}

 async function excel(project,items,withPhotos=false){ready(items);const z=await JSZip.loadAsync(IPIV_XLSX_TEMPLATE,{base64:true});const rows=[headers,...items.map(a=>[a.code,a.name,description(a),a.category,a.location,a.w,a.h,a.d,a.weight,a.qty,a.kind==='plano'?'Plano':'3D',a.turn?'Sí':'No',a.lay?'Sí':'No',a.weightBasis==='measured'?'Medido':'Estimado',a.brand,a.model,a.serial,withPhotos&&a.photos.length?'imagenes/'+a.id+'.jpg':'',a.id,project.id])];const template=await z.file('xl/worksheets/sheet1.xml').async('string');
  const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',doc=new DOMParser().parseFromString(template,'application/xml');if(doc.querySelector('parsererror'))throw Error('Plantilla interna no válida.');
  const sd=doc.getElementsByTagNameNS(ns,'sheetData')[0],styleIds=Array.from(sd.getElementsByTagNameNS(ns,'row')[0].children).map(c=>c.getAttribute('s')||'0'),bodyStyles=Array.from(sd.getElementsByTagNameNS(ns,'row')[1]?.children||[]).map(c=>c.getAttribute('s')||'0');

  let output=new XMLSerializer().serializeToString(doc);

  z.file('xl/worksheets/sheet1.xml',output);return z.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 }
 async function bundle(project,items,getAsset){ready(items);const z=new JSZip();let photoBytes=0;z.file('articulos.xlsx',await (await excel(project,items,true)).arrayBuffer());for(const a of items)if(a.photos.length){const f=await getAsset(a.photos[0].id);if(!f)throw Error('Falta la foto de '+a.code+'. No se generó un paquete incompleto.');photoBytes+=f.blob.size;if(photoBytes>40*1024*1024)throw Error('Las fotos principales superan 40 MB. Exporte una selección menor.');z.file('imagenes/'+a.id+'.jpg',await f.blob.arrayBuffer());}z.file('LEAME.txt','IP — Inventario Visual 01A\nImportar con el icono Excel + fotos de la calculadora v4.19.1.\nSolo la foto principal acompaña cada artículo. Este ZIP NO es un respaldo móvil.\nLas fotos adicionales y notas internas se conservan en el respaldo móvil.\nLos UUID se conservan como columnas de referencia, no habilitan sincronización.\n');const blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});if(blob.size>60*1024*1024)throw Error('El ZIP excede 60 MB. Exporte una selección menor.');return blob;}
 const mapChars={'—':'-','–':'-','…':'...','’':"'",'‘':"'",'“':'"','”':'"','→':'>','\u202f':' ','\u00a0':' '};
 function pdfText(s){s=String(s??'').replace(/[—–…’‘“”→\u202f\u00a0]/g,c=>mapChars[c]);if([...s].some(c=>c.charCodeAt(0)>255))throw Error('El PDF de esta vista previa admite caracteres latinos. Revise el texto: '+s.slice(0,55));return s.replace(/[\r\n\t]/g,' ').replace(/[\\()]/g,c=>'\\'+c);}
 const ctx=document.createElement('canvas').getContext('2d');
 function measure(s,size,bold=false){ctx.font=`${bold?'bold ':''}${size}px Arial`;return ctx.measureText(s).width;}
 function wrap(s,width,size,bold=false,max=Infinity){s=String(s||'');const lines=[];for(const para of s.split('\n')){let line='';for(const word of para.split(/\s+/)){if(!word)continue;if(measure(word,size,bold)>width){if(line){lines.push(line);line='';}for(const ch of word){if(measure(line+ch,size,bold)>width){lines.push(line);line='';}line+=ch;}continue;}if(line&&measure(line+' '+word,size,bold)>width){lines.push(line);line=word;}else line+=(line?' ':'')+word;}if(line)lines.push(line);}if(lines.length>max){lines.length=max;let s=lines[max-1];while(s&&measure(s+'...',size,bold)>width)s=s.slice(0,-1);lines[max-1]=s+'...';}return lines;}
 class PDF{
  constructor(){this.objects=[null];this.catalog=this.reserve();this.pages=this.reserve();this.reg=this.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');this.bold=this.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');this.pageIds=[];this.im=0;}
  reserve(){this.objects.push(null);return this.objects.length-1;}
  add(s){this.objects.push(typeof s==='string'?latin(s):s);return this.objects.length-1;}
  stream(bytes,dict=''){return this.add(join([latin(`<< /Length ${bytes.length} ${dict} >>\nstream\n`),bytes,latin('\nendstream')]));}
  page(w,h){const p={w,h,ops:[],images:[]};this.current=p;return p;}
  text(s,x,y,size=10,bold=false,color='0 0 0'){this.current.ops.push(`${color} rg BT /${bold?'B':'F'} ${size} Tf 1 0 0 1 ${x} ${y} Tm (${pdfText(s)}) Tj ET`);}
  lines(s,x,y,width,size=10,bold=false,max=Infinity){const ls=wrap(s,width,size,bold,max);for(let i=0;i<ls.length;i++)this.text(ls[i],x,y-i*size*1.28,size,bold);return y-ls.length*size*1.28;}
  rect(x,y,w,h,color='0 0 0'){this.current.ops.push(`${color} rg ${x.toFixed(3)} ${y.toFixed(3)} ${w.toFixed(3)} ${h.toFixed(3)} re f`);}
  qr(a,x,y,size){const q=IV.qr(a),n=q.getModuleCount(),step=size/(n+8);this.rect(x,y,size,size,'1 1 1');this.current.ops.push('0 0 0 rg');for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(c,r))this.current.ops.push(`${(x+(r+4)*step).toFixed(4)} ${(y+(n-c+3)*step).toFixed(4)} ${step.toFixed(4)} ${step.toFixed(4)} re f`);}
  async image(asset,x,y,w,h){const data=new Uint8Array(await asset.blob.arrayBuffer()),id=this.stream(data,`/Type /XObject /Subtype /Image /Width ${asset.width} /Height ${asset.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`),name='Im'+(++this.im),scale=Math.min(w/asset.width,h/asset.height),iw=asset.width*scale,ih=asset.height*scale;this.current.images.push([name,id]);this.current.ops.push(`q ${iw} 0 0 ${ih} ${x+(w-iw)/2} ${y+(h-ih)/2} cm /${name} Do Q`);}
  end(){const p=this.current,st=this.stream(latin(p.ops.join('\n'))),id=this.add(`<< /Type /Page /Parent ${this.pages} 0 R /MediaBox [0 0 ${p.w} ${p.h}] /Resources << /Font << /F ${this.reg} 0 R /B ${this.bold} 0 R >> /XObject << ${p.images.map(([n,id])=>'/'+n+' '+id+' 0 R').join(' ')} >> >> /Contents ${st} 0 R >>`);this.pageIds.push(id);}
  blob(){this.objects[this.catalog]=latin(`<< /Type /Catalog /Pages ${this.pages} 0 R >>`);this.objects[this.pages]=latin(`<< /Type /Pages /Kids [${this.pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${this.pageIds.length} >>`);const chunks=[latin('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')],offsets=[0];let offset=chunks[0].length;for(let i=1;i<this.objects.length;i++){offsets.push(offset);const a=join([latin(i+' 0 obj\n'),this.objects[i],latin('\nendobj\n')]);chunks.push(a);offset+=a.length;}chunks.push(latin(`xref\n0 ${this.objects.length}\n0000000000 65535 f \n${offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size ${this.objects.length} /Root ${this.catalog} 0 R >>\nstartxref\n${offset}\n%%EOF`));return new Blob(chunks,{type:'application/pdf'});}
 }
 function labels(items,format='2x3',copies=1){if(!items.length)throw Error('Seleccione artículos.');if(!Number.isInteger(copies)||copies<1||copies>20||items.length*copies>200)throw Error('Copias: 1–20; máximo 200 etiquetas por archivo.');if(!['2x3','3x2','4x6'].includes(format))throw Error('Formato no válido.');const pdf=new PDF();for(const a of items)for(let i=0;i<copies;i++){const landscape=format==='3x2',s=format==='4x6'?2:1;pdf.page(landscape?216:144*s,landscape?144:216*s);if(landscape){const labelName=(a.qty>1?'Lote '+a.qty+' · ':'')+a.name;let size=15;while(size>8&&measure(a.code,size,true)>195)size-=.5;if(measure(a.code,size,true)>195)throw Error('Código demasiado largo para etiqueta horizontal.');pdf.text(a.code,9,121,size,true);pdf.lines(labelName,9,100,110,10,true,2);pdf.text('UBICACIÓN',9,63,7,true);pdf.lines(a.location||'Sin ubicación',9,50,108,9,false,3);pdf.qr(a,125,12,82);}else{let size=17;while(size>8&&measure(a.code,size,true)>126)size-=.5;if(measure(a.code,size,true)<=126){pdf.text(a.code,9*s,194*s,size*s,true);}else{const codeLines=wrap(a.code,126,8,true);if(codeLines.length>2)throw Error('Código demasiado largo para esta etiqueta.');codeLines.forEach((line,k)=>pdf.text(line,9*s,(199-k*10)*s,8*s,true));}pdf.lines((a.qty>1?'Lote '+a.qty+' · ':'')+a.name,9*s,173*s,126*s,11*s,true,2);pdf.text('UBICACIÓN',9*s,140*s,8*s,true);pdf.lines(a.location||'Sin ubicación',9*s,127*s,126*s,9*s,false,2);pdf.qr(a,24*s,9*s,96*s);}pdf.end();}return pdf.blob();}
 async function catalog(project,items,getAsset,{detailed=false,privateNotes=false}={}){if(!items.length)throw Error('Seleccione artículos.');const pdf=new PDF(),W=595.28,H=841.89,green='.063 .298 .235',pages=[];let pageNo=0;

  const footer=()=>{pdf.rect(30,35,535,.7,'.8 .85 .82');pdf.text('Página '+pageNo+' · '+new Date().toLocaleDateString('es-DO'),30,21,8);pdf.text('Fotografías optimizadas · conservar originales',290,21,8);pdf.end();};
  let y=0;
  for(let index=0;index<items.length;index++){const a=items[index];if(detailed||index%2===0)y=header();const height=detailed?600:290;pdf.rect(30,y-height,535,height,'.963 .975 .965');pdf.text(a.code,44,y-24,10,true,green);pdf.lines(a.name,44,y-46,425,14,true,2);pdf.qr(a,490,y-70,58);const photoH=detailed?225:155,photoY=y-87-photoH;const asset=a.photos.length?await getAsset(a.photos[0].id):null;if(a.photos.length&&!asset)throw Error('Falta una foto local de '+a.code+'. Restaure su respaldo.');if(asset)await pdf.image(asset,44,photoY,215,photoH);else{pdf.rect(44,photoY,215,photoH,'.92 .94 .92');pdf.text('Sin fotografía',90,photoY+photoH/2,11,false,'.4 .47 .43');}
    let ty=y-96;ty=pdf.lines('Ubicación: '+(a.location||'Sin especificar'),274,ty,265,10,true,2)-8;ty=pdf.lines('Cantidad: '+a.qty+(a.qty>1?' (lote)':''),274,ty,265,10)-8;ty=pdf.lines('Medidas: '+[a.w,a.h,a.d].map(IV.fmt).join(' × ')+' cm',274,ty,265,10,false,2)-8;ty=pdf.lines('Peso unitario: '+(a.weight==null?'pendiente':IV.fmt(a.weight)+' kg · '+(a.weightBasis==='measured'?'medido':'estimado')),274,ty,265,10,false,2)-8;ty=pdf.lines([a.brand,a.model,a.serial?'Serie '+a.serial:''].filter(Boolean).join(' · '),274,ty,265,9,false,2)-5;pdf.lines(description(a)||'Sin descripción adicional',274,ty,265,9,false,detailed?7:3);
    if(detailed){let dy=photoY-28;pdf.text('Fotografías adicionales',44,dy,10,true);const additional=a.photos.slice(1,4);for(let j=0;j<additional.length;j++){const f=await getAsset(additional[j].id);if(!f)throw Error('Falta una foto adicional de '+a.code);await pdf.image(f,44+j*166,dy-118,154,101);pdf.lines(additional[j].caption||'Detalle '+(j+1),44+j*166,dy-131,154,8,false,2);}if(!additional.length)pdf.text('Sin fotografías adicionales.',44,dy-20,9);if(privateNotes&&a.notes){pdf.text('Observaciones internas',44,dy-163,10,true);pdf.lines(a.notes,44,dy-180,500,9,false,4);}footer();
      if(a.photos.length>4){y=header();pdf.text(a.code+' · Continuación fotográfica',30,y,12,true);for(let j=4;j<a.photos.length;j++){const f=await getAsset(a.photos[j].id);if(!f)throw Error('Foto adicional ausente.');await pdf.image(f,40,y-250-(j-4)*250,250,215);pdf.lines(a.photos[j].caption||'Detalle '+j,305,y-90-(j-4)*250,235,10,false,8);}footer();}
    }else{y-=height+15;if(index%2===1||index===items.length-1)footer();}
  }return pdf.blob();

 const icon=k=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.documents}"/></svg>`;

 function render(){if(!state)return;$('nav').innerHTML=[['projects','Proyectos'],['inventory','Inventario'],['scan','Escanear'],['documents','Documentos']].map(([id,label])=>`<button class="${tab===id?'active':''}" data-action="nav" data-id="${id}" ${tab===id?'aria-current="page"':''}>${icon(id)}<span>${label}</span></button>`).join('');if(tab==='projects')renderProjects();else if(!current())$('app').innerHTML=`<div class="empty">${icon('projects')}<h2>Selecciona un proyecto</h2><p>El inventario, el catálogo y las etiquetas comparten los mismos artículos.</p><div class="toolbar" style="justify-content:center">${btn('nav','Ver proyectos','projects','','projects')}</div></div>`;else if(tab==='inventory')renderInventory();else if(tab==='scan')renderScan();else renderDocs();loadImages();}

 async function optimize(file){if(!file||file.size>15*1024*1024)throw Error('Foto: máximo 15 MB por archivo.');if(!/^image\//.test(file.type))throw Error('Seleccione una imagen.');const url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();if(im.naturalWidth*im.naturalHeight>40e6)throw Error('Imagen demasiado grande. Use una toma de menor resolución.');const scale=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);let blob;for(const quality of [.84,.72,.6,.45]){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',quality));if(blob?.size<=400*1024)break;}if(!blob||blob.size>400*1024)throw Error('No se pudo preparar una copia compacta.');return {id:IV.uid(),blob,width:c.width,height:c.height,originalName:IV.text(file.name,160),createdAt:IV.now()};}catch(err){throw Error('No se pudo leer la fotografía. Use JPG, PNG o WebP. '+err.message);}finally{URL.revokeObjectURL(url);}}
 async function addPhotos(files){if(!edit)return;const owner=edit.id;if(edit.photos.length+files.length>6)throw Error('Máximo seis fotos por ficha.');for(const file of files){status('Preparando fotografía…');const a=await optimize(file);await DB.write('photos',a);if(!edit||edit.id!==owner)return;edit.photos.push({id:a.id,caption:''});dirty=true;renderPhotos();await flushDraft();}status('Fotos del borrador guardadas localmente.');}
 async function saveArticle(form,another=false){const p=current();if(!p||!edit||p.id!==edit.projectId)throw Error('El proyecto cambió.');await flushDraft();const existing=p.items.find(a=>a.id===edit.id),a=IV.article(rawForm(),existing),next=clone(),np=next.projects.find(x=>x.id===p.id);if(np.items.some(x=>x.id!==a.id&&x.code===a.code))throw Error('Ese código ya está asignado en el proyecto.');if(existing)np.items[np.items.findIndex(x=>x.id===a.id)]=a;else np.items.push(a);IV.validateProject(np);np.defaultLocation=a.location;np.updatedAt=IV.now();await commit(next);await DB.remove('meta','draft');dirty=false;edit=null;await close(true);tab='inventory';render();toast('Artículo guardado.');if(another)await articleDialog();}

 function renderScan(){$('app').innerHTML=`<div class="heading"><div><div class="eyebrow">Identificación</div><h1>Encontrar una ficha</h1><p class="note">Escanear nunca crea otro artículo ni cambia su ubicación.</p></div></div><div class="card"><h3>QR del artículo</h3><p class="note">La ficha debe estar guardada en este dispositivo. Los códigos de cajas de la calculadora son distintos.</p><div id="scan-frame" class="scan-frame"><div>${icon('scan')}<p style="font-size:12px">Cámara detenida</p></div></div><div class="toolbar">${'BarcodeDetector' in window?btn('start-scan','Activar cámara','camera','primary'):'<button type="button" disabled>Detector no disponible</button>'}${btn('stop-scan','Detener','scan')}</div><p id="scan-info" class="note">Detector de QR ${'BarcodeDetector' in window?'disponible en este navegador; pendiente de prueba física.':'no disponible en este navegador. Utiliza el código visible; lector común Android/iOS pendiente en esta vista previa.'}</p></div><div class="card"><label for="code-search">Código visible o contenido del QR</label><input id="code-search" placeholder="ART-001 o IPIV1|…" autocapitalize="characters"><div class="toolbar">${btn('find-code','Buscar ficha','scan','primary')}</div><div id="scan-result"></div></div>`;}
 function stopScan(){scanToken++;if(stream)for(const t of stream.getTracks())t.stop();stream=null;}
 async function startScan(){stopScan();const token=scanToken;if(!globalThis.BarcodeDetector)throw Error('Este navegador no dispone del lector utilizado en 01A. Busque con el código impreso.');if(!navigator.mediaDevices?.getUserMedia)throw Error('La cámara necesita HTTPS o localhost y permiso.');const detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});if(scanToken!==token){stream.getTracks().forEach(t=>t.stop());return;}$('scan-frame').innerHTML='<video autoplay playsinline muted></video><span class="scan-target"></span>';const video=$('scan-frame').querySelector('video');video.srcObject=stream;await video.play();async function loop(){if(scanToken!==token||!stream)return;try{const codes=await detector.detect(video);if(codes.length){const code=codes[0].rawValue;stopScan();await findCode(code);return;}}catch{}setTimeout(loop,240);}loop();}
 async function findCode(raw){raw=IV.text(raw,180);const id=IV.parseQR(raw);if(raw.startsWith('IPIV1|')&&!id)throw Error('QR de artículo inválido.');const matches=[];for(const p of state.projects)for(const a of p.items)if(id?a.id===id:(p.id===state.activeId&&a.code===raw.toUpperCase()))matches.push({p,a});if(matches.length!==1){if($('scan-result'))$('scan-result').innerHTML='<div class="alert">Artículo no disponible en este dispositivo o código no reconocido. No se creó ningún registro.</div>';return false;}const {p,a}=matches[0];if(state.activeId!==p.id){const next=clone();next.activeId=p.id;await commit(next);}await detail(a.id);return true;}
 function renderDocs(){const p=current();if(selectionProject!==p.id){selection=new Set(p.items.map(a=>a.id));selectionProject=p.id;}selection=new Set([...selection].filter(id=>p.items.some(a=>a.id===id)));$('app').innerHTML=`<div class="heading"><div><div class="eyebrow">${e(p.name)}</div><h1>Documentos y salida</h1><p class="note">Una selección, diferentes formatos. Sin duplicar artículos.</p></div>${btn('backup','Respaldar proyecto completo','save','icon')}</div><div class="card"><div class="heading"><h3>Artículos seleccionados</h3><span class="selection-count" id="selection-count">${selection.size} / ${p.items.length}</span></div><div class="toolbar">${btn('select-all','Todos','check')}${btn('select-ready','Solo completos','inventory')}${btn('select-none','Ninguno','back')}</div><div class="select-list">${p.items.map(a=>`<label><input type="checkbox" data-select="${a.id}" ${selection.has(a.id)?'checked':''}><span><b>${e(a.code)} · ${e(a.name)}</b><br><small class="note">${e(a.location||'Sin ubicación')} · ${IV.ready(a)?'Listo para empaque':'Datos pendientes'}</small></span></label>`).join('')||'<p class="note">Añade artículos primero.</p>'}</div></div><div class="document-grid"><section class="card"><span class="tag">FORMATO OPERATIVO</span><h3 style="margin-top:12px">Etiquetas con QR</h3><div class="fields"><div><label>Etiqueta</label><select id="label-format"><option value="2x3">2 × 3 plg · vertical</option><option value="3x2">2 × 3 plg · horizontal</option><option value="4x6">4 × 6 plg · prueba</option></select></div><div><label>Copias por artículo</label><input id="label-copies" type="number" value="1" min="1" max="20" step="1"></div></div><p class="note" style="margin-top:12px">Código, nombre, ubicación y QR. Negro sobre blanco. Una página PDF por etiqueta. No marca la impresión como confirmada.</p><div class="toolbar">${btn('labels','Generar PDF','print','primary')}${btn('label-preview','Vista previa','documents')}</div><p class="note">Jadens: abrir el PDF en la aplicación compatible. Modelo, rollo y escala real pendientes de prueba. No hay Bluetooth directo.</p></section><section class="card"><span class="tag">PRESENTACIÓN FOTOGRÁFICA</span><h3 style="margin-top:12px">Catálogo de artículos</h3><label>Distribución</label><select id="catalog-format"><option value="compact">Resumido · dos fichas por página</option><option value="detailed">Detallado · ficha y galería</option></select><label class="check"><input id="private-notes" type="checkbox">Incluir observaciones internas (solo detallado)</label><div class="toolbar">${btn('catalog','Generar catálogo PDF','documents','primary')}</div><p class="note">Nombre en negrita, ubicación, medidas, peso, fotografías y QR. Se permite incluir fichas con datos pendientes.</p></section><section class="card"><h3>Enviar a la calculadora</h3><p class="note">Solo artículos con medidas y peso completos. No se inventan valores. La calculadora sigue funcionando por separado.</p><div class="toolbar">${btn('excel','Excel sin fotos','export')}${btn('photozip','ZIP con foto principal','camera')}</div><p class="note">El ZIP usa el formato de v4.19.1. Las fotos adicionales se conservan en el respaldo móvil, no se exportan a la calculadora.</p></section><section class="card"><h3>Respaldo completo del inventario</h3><p class="note">Incluye todas las fichas de este proyecto, sus identidades, las copias fotográficas guardadas y notas internas. No incluye otros proyectos.</p><div class="toolbar">${btn('backup','Generar respaldo JSON','save','primary')}${btn('restore','Restaurar','import')}</div><p class="note">No es una sincronización. Restaurar un proyecto existente pide reemplazo explícito. Conserva los originales de tus fotos aparte.</p></section></div>`;}
 const selected=()=>current().items.filter(a=>selection.has(a.id));
 async function fileReady(name,blob){const url=URL.createObjectURL(blob),file=new File([blob],name,{type:blob.type});objectFiles.push(url);open('Archivo preparado',`<div class="file-ready">${icon('documents')}<h3>${e(name)}</h3><p class="note">${(blob.size/1024).toFixed(1)} KB · generado en este dispositivo</p><a class="btn primary" href="${url}" download="${e(name)}">${icon('export')}Descargar archivo</a>${navigator.canShare?.({files:[file]})?'<button id="share-file" type="button" style="margin-left:8px">Compartir / enviar</button>':''}<p class="note">Generar no confirma que el archivo haya sido guardado fuera de la aplicación ni que una etiqueta haya sido impresa.</p></div>`);$('share-file')?.addEventListener('click',()=>navigator.share({files:[file],title:name}).catch(err=>{if(err.name!=='AbortError')toast(err.message,true);}));}
 async function makeLabels(one=null){const items=one?[current().items.find(a=>a.id===one)]:selected(),format=one?'2x3':$('label-format')?.value||'2x3',copies=one?1:Number($('label-copies').value);const blob=DOC.labels(items,format,copies);await fileReady('Etiquetas_IP_'+format+'_'+IV.fileName(current().name)+'.pdf',blob);}
 function labelPreview(){const a=selected()[0];if(!a)throw Error('Seleccione un artículo.');open('Etiqueta operativa · 2 × 3 pulgadas',`<p class="note">Referencia visual. El PDF genera el tamaño físico elegido; esta vista no calibra la impresora.</p><div class="label-preview"><div class="code">${e(a.code)}</div><div class="label-name">${e((a.qty>1?'Lote '+a.qty+' · ':'')+a.name)}</div><div class="loc"><b>UBICACIÓN</b><br>${e(a.location||'Sin ubicación')}</div>${IV.qrSVG(a)}</div><p class="note">Al cambiar de ubicación, debe reimprimir para actualizar el texto. El QR conserva la identidad.</p>`);}
 async function backup(id=state.activeId){const p=state.projects.find(p=>p.id===id);if(!p)throw Error('Seleccione un proyecto.');const pending=await DB.get('meta','draft');if(pending?.projectId===p.id)throw Error('Hay una ficha en borrador. Ábrala y guárdela o descarte el borrador antes de respaldar; las fotos pendientes no se omiten silenciosamente.');const photos={};for(const a of p.items)for(const f of a.photos)if(!photos[f.id]){const v=await asset(f.id);if(!v)throw Error('Falta una foto local: no se exportó un respaldo incompleto.');const dataURL=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(v.blob);});photos[f.id]={id:v.id,width:v.width,height:v.height,dataURL,originalName:v.originalName};}const at=IV.now(),b={application:'IP Inventario Visual',kind:'project-backup',schemaVersion:1,version:IV.VERSION,exportedAt:at,project:structuredClone(p),photos:Object.values(photos)};b.project.lastBackup=at;const blob=new Blob([JSON.stringify(b)],{type:'application/json'});if(blob.size>120*1024*1024)throw Error('Respaldo demasiado grande para 01A.');const next=clone();next.projects.find(x=>x.id===id).lastBackup=at;await commit(next);await fileReady('IPIV_'+IV.fileName(p.name)+'.json',blob);}
 async function restore(file){if(!file)return;if(file.size>120*1024*1024)throw Error('Respaldo máximo 120 MB.');const b=JSON.parse(await file.text());if(b.application!=='IP Inventario Visual'||b.kind!=='project-backup'||b.schemaVersion!==1)throw Error('Este acceso solo restaura respaldos de IP Inventario Visual, no los JSON de la calculadora.');const raw=b.project;if(!raw||!Array.isArray(raw.items)||raw.items.length>2000||!Array.isArray(b.photos)||b.photos.length>200)throw Error('Respaldo no válido.');const p=IV.project(raw);p.items=raw.items.map(a=>IV.article(a,a));IV.validateProject(p);const assetIds=new Set(),assets=[];for(const a of b.photos){if(!IV.validID(a.id)||assetIds.has(a.id)||typeof a.dataURL!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(a.dataURL)||a.dataURL.length>550000||!Number.isInteger(a.width)||!Number.isInteger(a.height)||a.width<1||a.height<1||Math.max(a.width,a.height)>1200)throw Error('Foto de respaldo no válida.');assetIds.add(a.id);const bytes=Uint8Array.from(atob(a.dataURL.split(',')[1]),c=>c.charCodeAt(0));if(bytes[0]!==255||bytes[1]!==216)throw Error('Foto de respaldo inválida.');const blob=new Blob([bytes],{type:'image/jpeg'}),url=URL.createObjectURL(blob);try{const im=new Image();im.src=url;await im.decode();if(im.naturalWidth!==a.width||im.naturalHeight!==a.height)throw Error('Medidas de foto inconsistentes.');}finally{URL.revokeObjectURL(url);}assets.push({id:a.id,blob,width:a.width,height:a.height,originalName:IV.text(a.originalName,160),createdAt:IV.now()});}
  for(const a of p.items)for(const f of a.photos)if(!assetIds.has(f.id))throw Error('El respaldo omite una fotografía referenciada.');for(const other of state.projects.filter(x=>x.id!==p.id))for(const a of p.items)if(other.items.some(o=>o.id===a.id||o.photos.some(f=>assetIds.has(f.id))))throw Error('Identidad ya utilizada en otro proyecto local. No se duplicaron registros.');
  if(!confirm((state.projects.some(x=>x.id===p.id)?'Este inventario ya existe. ¿Reemplazarlo por el respaldo? Exporte antes lo que necesita conservar.':'¿Añadir este inventario al dispositivo?')+'\n'+p.name+' · '+p.items.length+' fichas · '+assets.length+' fotos'))return;const next=clone();next.projects=next.projects.filter(x=>x.id!==p.id);next.projects.push(p);next.activeId=p.id;await commit(next,assets);for(const f of assets){if(cache.has(f.id))URL.revokeObjectURL(cache.get(f.id));cache.delete(f.id);}await close(true);selection.clear();selectionProject='';tab='inventory';render();toast('Respaldo restaurado con sus identidades y fotografías.');}
 async function demo(){const next=clone(),p=IV.project({name:'DEMO · Colección y equipos',client:'Cliente de demostración',reference:'DEMO-01A',defaultLocation:'Sala principal',demo:true});p.items=[IV.article({code:'OBR-001',name:'Cuadro del salón',category:'Obra de arte',location:'Sala principal',description:'Registro ficticio para revisar captura, catálogo y etiquetas.',author:'Sin atribución · demostración',w:80,h:120,d:6,weight:12,weightBasis:'estimated',kind:'plano',turn:true,lay:false}),IV.article({code:'EQ-002',name:'Equipo de oficina',category:'Equipo',location:'Oficina',w:45,h:70,d:40,weight:18,weightBasis:'measured',brand:'Ejemplo',model:'Demostración',serial:'DEMO-002'}),IV.article({code:'OBR-003',name:'Obra pendiente de medición',category:'Obra de arte',location:'Sala principal',description:'Puede figurar en el catálogo sin inventar medidas ni peso.',kind:'plano'})];next.projects.push(p);next.activeId=p.id;await commit(next);selection.clear();tab='inventory';render();}
 function help(){open('IP — Inventario Visual · 01A',`<div class="alert info"><b>Vista previa funcional, independiente de la calculadora.</b> No está publicada ni conectada a OSi Plus. Trabaje primero con datos de prueba.</div><h3>Flujo</h3><p>Proyecto → artículos y fotos → catálogo o etiquetas → exportación a la calculadora.</p><div class="section"><h3>Fotos y guardado</h3><p>Hasta seis fotos por ficha y 200 por proyecto. Copias JPEG de hasta 1,200 px y 400 KB. El archivo original no se modifica; conserve sus originales por separado. Fichas incompletas se guardan, pero no se exportan como medidas o peso cero.</p></div><div class="section"><h3>Etiquetas</h3><p>2 × 3 pulgadas operativa: código, nombre, ubicación y QR. Puede elegir orientación horizontal o 4 × 6 de prueba. Imprima al 100%, sin ajustar a página. El PDF no confirma impresión; no hay conexión Bluetooth directa con Jadens.</p></div><div class="section"><h3>Escaneo</h3><p>Esta vista previa utiliza el detector QR que ofrezca el navegador. Cuando no existe, busque el código visible. El lector de cámara común para todos los Android/iPhone todavía requiere integración. Los QR IPIV1 identifican artículos, no cajas de la calculadora. No abren una ficha pública.</p></div><div class="section"><h3>Archivos</h3><p>Excel sin fotos y ZIP con la principal son salidas para la calculadora v4.19.1. El respaldo JSON móvil conserva también fotos adicionales y notas. Restaurar es un reemplazo explícito del proyecto, no una sincronización ni un duplicado.</p></div><div class="section"><h3>Instalación</h3><p>El paquete web incluye manifiesto y caché offline para publicarlo mediante HTTPS. El HTML único sirve para una revisión local; no equivale a una instalación móvil. No borre los datos del navegador sin exportar un respaldo.</p></div><div class="section"><h3>Límites del piloto</h3><p>Sin usuarios ni cifrado propio, inventario de almacén, cadena de custodia, firma digital o integración directa con impresora. PDF con caracteres latinos; nombres largos se resumen en etiquetas y catálogo compacto, no en los datos. El botón Generar produce un archivo, no lo envía por sí solo.</p></div>`);}
 async function storage(){const x=await navigator.storage?.estimate?.(),persisted=await navigator.storage?.persisted?.();open('Almacenamiento local',`<p>Uso del origen: <b>${x?((x.usage||0)/1048576).toFixed(1)+' MB':'No informado'}</b></p><p>Cuota informada: <b>${x?((x.quota||0)/1048576).toFixed(0)+' MB':'No informada'}</b></p><p>Persistencia solicitada: <b>${persisted?'Concedida por el navegador':'No concedida'}</b></p><p class="note">El usuario puede borrar los datos aunque exista permiso de persistencia. Exporte un respaldo; no hay copia en la nube.</p><div class="toolbar">${btn('persist-storage','Solicitar conservación local','save')}</div>`);}
 async function action(act,id){switch(act){case'nav':return navigate(id);case'help':return help();case'close':return close();case'discard-draft':if(!confirm('¿Descartar los cambios no confirmados de esta ficha? No se elimina el artículo guardado.'))return;clearTimeout(draftTimer);await draftChain.catch(()=>{});await DB.remove('meta','draft');dirty=false;edit=null;await close(true);return;case'new-project':return projectDialog();case'edit-project':return projectDialog(id);case'select-project':{const next=clone();next.activeId=id;await commit(next);selection.clear();return navigate('inventory');}case'new-article':return articleDialog();case'edit-article':await close(true);return articleDialog(id);case'detail':return detail(id);case'view-grid':view='grid';return renderInventory();case'view-list':view='list';return renderInventory();case'take-photo':return $('photo-camera').click();case'choose-photo':return $('photo-gallery').click();case'primary-photo':{const p=edit.photos.find(p=>p.id===id);edit.photos=[p,...edit.photos.filter(x=>x.id!==id)];scheduleDraft();return renderPhotos();}case'delete-photo':edit.photos=edit.photos.filter(p=>p.id!==id);scheduleDraft();return renderPhotos();case'delete-article':return removeArticle(id);case'duplicate':return duplicate(id);case'select-all':selection=new Set(current().items.map(a=>a.id));return renderDocs();case'select-ready':selection=new Set(current().items.filter(IV.ready).map(a=>a.id));return renderDocs();case'select-none':selection.clear();document.querySelectorAll('[data-select]').forEach(x=>x.checked=false);$('selection-count').textContent='0 / '+current().items.length;return;case'label-one':return makeLabels(id);case'labels':return makeLabels();case'label-preview':return labelPreview();case'catalog':{const detailed=$('catalog-format').value==='detailed',privateNotes=$('private-notes').checked;if(privateNotes&&!detailed)throw Error('Las notas internas requieren formato detallado.');return fileReady('Catalogo_IP_'+IV.fileName(current().name)+'.pdf',await DOC.catalog(current(),selected(),asset,{detailed,privateNotes}));}case'excel':return fileReady('Articulos_'+IV.fileName(current().name)+'.xlsx',await DOC.excel(current(),selected()));case'photozip':return fileReady('Articulos_fotos_'+IV.fileName(current().name)+'.zip',await DOC.bundle(current(),selected(),asset));case'backup':return backup();case'backup-project':return backup(id);case'restore':$('restore-file').value='';return $('restore-file').click();case'demo':return demo();case'start-scan':return startScan();case'stop-scan':stopScan();return renderScan();case'find-code':return findCode($('code-search').value);case'storage':return storage();case'persist-storage':{const ok=await navigator.storage?.persist?.();toast(ok?'El navegador concedió persistencia. Mantenga un respaldo externo.':'El navegador no concedió persistencia. Mantenga sus respaldos.');return storage();}}}
 let busy=false;
 async function guard(fn,el){if(busy)return;busy=true;if(el)el.disabled=true;try{await fn();}catch(err){console.error(err);toast(err.message||'No se completó la operación.',true);}finally{busy=false;if(el?.isConnected)el.disabled=false;}}
 async function init(){try{state=await DB.get('meta','state')||IV.blank();if(state.schemaVersion!==1||!Array.isArray(state.projects))throw Error('Almacenamiento incompatible. No se han borrado datos.');status('Almacenamiento local disponible · sin nube');render();}catch(err){$('app').innerHTML=`<div class="alert bad"><h2>No se abrió el almacenamiento</h2><p>${e(err.message)}</p><p>No se han borrado datos. Revise los permisos del navegador o el paquete HTTPS.</p></div>`;status('No disponible',true);return;}
  document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el)guard(()=>action(el.dataset.action,el.dataset.id),el);});
  document.addEventListener('submit',ev=>{ev.preventDefault();if(ev.target.id==='project-form')guard(()=>saveProject(ev.target),ev.submitter);if(ev.target.id==='article-form')guard(()=>saveArticle(ev.target,ev.submitter?.value==='another'),ev.submitter);});
  document.addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;renderItems();}if(ev.target.closest('#article-form')){if(ev.target.dataset.caption){const p=edit.photos.find(p=>p.id===ev.target.dataset.caption);if(p)p.caption=ev.target.value;}scheduleDraft();}});
  document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='location-filter'){locationFilter=el.value;renderItems();}if(el.dataset.select){if(el.checked)selection.add(el.dataset.select);else selection.delete(el.dataset.select);$('selection-count').textContent=selection.size+' / '+current().items.length;}if(['photo-camera','photo-gallery'].includes(el.id))guard(()=>addPhotos([...el.files]));if(el.id==='restore-file')guard(()=>restore(el.files[0]));if(el.id==='length-unit'&&edit){const old=edit.unit==='plg'?2.54:1,nw=el.value==='plg'?2.54:1;for(const k of ['w','h','d']){const field=$('article-form').elements[k];if(field.value!=='')field.value=Number((Number(field.value)*old/nw).toFixed(6));}edit.unit=el.value;scheduleDraft();}if(el.id==='weight-unit'&&edit){const f=$('article-form').elements.weight,old=edit.weightUnit==='lb'?1/2.20462262185:1,nw=el.value==='lb'?1/2.20462262185:1;if(f.value!=='')f.value=Number((Number(f.value)*old/nw).toFixed(6));edit.weightUnit=el.value;scheduleDraft();}});
  $('dialog').addEventListener('cancel',ev=>{if(edit){ev.preventDefault();guard(()=>close());}});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopScan();flushDraft().catch(()=>{});}});window.addEventListener('pagehide',()=>{stopScan();flushDraft().catch(()=>{});});window.addEventListener('online',network);window.addEventListener('offline',network);network();
  if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.IPIV_STANDALONE)navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('network-status').textContent=navigator.serviceWorker.controller?'Recursos offline listos':'Recursos preparados · reabrir para uso offline';}).catch(()=>{$('network-status').textContent='Sin caché offline · revisar HTTPS';});
 }
 function network(){$('network-status').textContent=navigator.onLine?'Local · no sincronizado':'Sin red · modo local';}
 return {init,get state(){return structuredClone(state);},get current(){return structuredClone(current());},asset,photoURL,action,articleDialog,detail,findCode,restore,backup,demo,stopScan};
})();
App.init();
